<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPLORE — JAV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #e84545;
      --accent2: #ff6b35;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px;
      background: linear-gradient(135deg, #e8365d, #ff6b35);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;
    }
    .page-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      border: 1px solid rgba(232,69,69,0.3); padding: 3px 10px; border-radius: 6px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 6px 14px; border-radius: 8px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 13px; transition: all 0.2s; text-decoration: none;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* Search bar */
    .search-wrap {
      display: flex; gap: 8px; padding: 16px 24px 0; max-width: 700px;
    }
    .search-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(232,69,69,0.5); }
    .search-input::placeholder { color: var(--muted); }
    .search-btn {
      padding: 10px 20px; background: var(--accent); border: none; border-radius: 8px;
      color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px;
      font-weight: 500; transition: all 0.2s; white-space: nowrap;
    }
    .search-btn:hover { background: #c93535; }

    .layout { display: flex; min-height: calc(100vh - 60px); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 220px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); padding: 16px 0;
      position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto;
    }
    .sidebar-section { padding: 0 14px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .sidebar-section:last-child { border-bottom: none; margin-bottom: 0; }
    .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }

    .type-list { display: flex; flex-direction: column; gap: 3px; }
    .type-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 7px; background: none; border: none; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; text-align: left; transition: all 0.15s; width: 100%;
    }
    .type-btn:hover { background: var(--surface2); color: var(--text); }
    .type-btn.active { color: var(--accent); background: rgba(232,69,69,0.12); }
    .type-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }

    /* Actor search in sidebar */
    .actor-search-wrap { display: flex; flex-direction: column; gap: 6px; }
    .actor-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px;
      outline: none; transition: border-color 0.2s;
    }
    .actor-input:focus { border-color: rgba(232,69,69,0.4); }
    .actor-input::placeholder { color: var(--muted); }
    .actor-apply-btn {
      width: 100%; padding: 6px; background: var(--accent); border: none; border-radius: 7px;
      color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 12px; transition: all 0.2s;
    }
    .actor-apply-btn:hover { background: #c93535; }

    /* Category filter */
    .cat-filter-wrap { display: flex; flex-direction: column; gap: 6px; }
    .cat-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 12px;
      outline: none; transition: border-color 0.2s;
    }
    .cat-input:focus { border-color: rgba(232,69,69,0.4); }
    .cat-input::placeholder { color: var(--muted); }
    .cat-list { display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; }
    .cat-btn {
      padding: 5px 8px; border-radius: 5px; background: none; border: none; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 11px; cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .cat-btn:hover { background: var(--surface2); color: var(--text); }
    .cat-btn.active { color: var(--accent); background: rgba(232,69,69,0.12); }

    /* Active filter chips */
    .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .filter-chip-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(232,69,69,0.12); border: 1px solid rgba(232,69,69,0.3);
      color: var(--accent); padding: 3px 8px 3px 10px; border-radius: 20px; font-size: 11px;
    }
    .filter-chip-tag button {
      background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 1px;
    }

    /* ===== MAIN ===== */
    .main { flex: 1; min-width: 0; padding: 16px 20px 24px; }

    .search-result-banner {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .search-result-banner.hidden { display: none; }
    .clear-search {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'DM Sans', sans-serif; transition: all 0.2s; white-space: nowrap;
    }
    .clear-search:hover { color: var(--text); }

    .info-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .info-count { font-size: 12px; color: var(--muted); }
    .info-count span { color: var(--text); font-weight: 600; }

    /* Search result card */
    .search-result-area { margin-bottom: 20px; }
    .search-variants { display: flex; flex-direction: column; gap: 10px; }
    .variant-card {
      display: flex; gap: 16px; background: var(--surface); border: 1px solid rgba(232,69,69,0.15);
      border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s;
    }
    .variant-card:hover { border-color: rgba(232,69,69,0.35); }
    .variant-thumb { width: 180px; flex-shrink: 0; object-fit: cover; background: var(--surface2); aspect-ratio: 16/10; }
    .variant-body { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .variant-type {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 4px; align-self: flex-start;
    }
    .variant-type.censored { background: rgba(232,69,69,0.15); color: var(--accent); }
    .variant-type.uncensored { background: rgba(72,207,173,0.15); color: #48cfad; }
    .variant-type.leaked { background: rgba(255,107,53,0.15); color: var(--accent2); }
    .variant-type.subtitle { background: rgba(108,99,255,0.15); color: #a09aff; }
    .variant-type.other { background: var(--surface2); color: var(--muted); }
    .variant-code { font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--accent); }
    .variant-title { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .variant-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .variant-badge { background: var(--surface2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 20px; font-size: 11px; color: var(--muted); }
    .variant-cats { display: flex; flex-wrap: wrap; gap: 4px; }
    .variant-cat { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--surface2); color: var(--muted); }
    .variant-play {
      display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: white;
      padding: 7px 14px; border-radius: 7px; text-decoration: none; font-size: 12px; font-weight: 500;
      transition: all 0.2s; align-self: flex-start; margin-top: auto;
    }
    .variant-play:hover { background: #c93535; }

    /* Grid */
    .jav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px; }
    .jav-card {
      background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
      overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none; display: block;
    }
    .jav-card:hover { transform: translateY(-4px); border-color: rgba(232,69,69,0.35); box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
    .card-thumb { position: relative; aspect-ratio: 16/10; overflow: hidden; background: var(--surface2); }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .jav-card:hover .card-thumb img { transform: scale(1.06); }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.2s;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
    }
    .jav-card:hover .card-overlay { opacity: 1; }
    .play-pill { background: var(--accent); color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .card-code { position: absolute; top: 7px; left: 7px; background: rgba(0,0,0,0.8); color: var(--accent); padding: 2px 7px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .card-type-badge {
      position: absolute; top: 7px; right: 7px;
      padding: 2px 6px; border-radius: 3px; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .card-type-badge.censored { background: rgba(232,69,69,0.85); color: white; }
    .card-type-badge.uncensored { background: rgba(72,207,173,0.85); color: #0a0a0f; }
    .card-type-badge.leaked { background: rgba(255,107,53,0.85); color: white; }
    .card-type-badge.subtitle { background: rgba(108,99,255,0.85); color: white; }
    .card-type-badge.other { background: rgba(0,0,0,0.7); color: var(--muted); }
    .card-body { padding: 9px 11px; }
    .card-title { font-size: 11px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; line-height: 1.4; }
    .card-meta-row { display: flex; align-items: center; justify-content: space-between; }
    .card-date { font-size: 10px; color: var(--muted); }
    .card-actors { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }

    .loading-spinner { display: flex; align-items: center; justify-content: center; padding: 80px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 28px; }
    .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; transition: all 0.2s; }
    .page-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-num { font-size: 13px; color: var(--muted); padding: 0 8px; }

    .sidebar-toggle { display: none; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; align-items: center; gap: 6px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .sidebar.open { display: block; position: fixed; top: 60px; left: 0; z-index: 99; height: calc(100vh - 60px); width: 240px; }
      .sidebar-toggle { display: flex; }
      .jav-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
      .variant-card { flex-direction: column; }
      .variant-thumb { width: 100%; height: 160px; }
      .search-wrap { padding: 12px 16px 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="index.html" class="logo">XPLORE</a>
      <span class="page-badge">JAV</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Filter</button>
      <a href="index.html" class="back-btn">← Live Action</a>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="Cari kode JAV atau nama artis... (contoh: SSIS-392, Yua Mikami)" />
    <button class="search-btn" onclick="doSearch()">🔍 Cari</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">

      <!-- Type Filter -->
      <div class="sidebar-section">
        <div class="sidebar-label">Tipe</div>
        <div class="type-list" id="typeList">
          <button class="type-btn active" onclick="setType('', this)">
            <span>🎬 Semua</span>
          </button>
          <button class="type-btn" onclick="setType('censored', this)">
            <span>🔴 Censored</span>
            <span class="type-dot" style="background:#e84545"></span>
          </button>
          <button class="type-btn" onclick="setType('uncensored', this)">
            <span>🟢 Uncensored</span>
            <span class="type-dot" style="background:#48cfad"></span>
          </button>
          <button class="type-btn" onclick="setType('uncensored-leaked', this)">
            <span>🟠 Leaked</span>
            <span class="type-dot" style="background:#ff6b35"></span>
          </button>
          <button class="type-btn" onclick="setType('amateur', this)">
            <span>🎥 Amateur</span>
          </button>
          <button class="type-btn" onclick="setType('chinese-av', this)">
            <span>🇨🇳 Chinese AV</span>
          </button>
          <button class="type-btn" onclick="setType('english-subtitle', this)">
            <span>🔵 English Sub</span>
            <span class="type-dot" style="background:#a09aff"></span>
          </button>
        </div>
      </div>

      <!-- Actor Filter -->
      <div class="sidebar-section">
        <div class="sidebar-label">Filter Artis</div>
        <div class="actor-search-wrap">
          <input class="actor-input" id="actorInput" type="text" placeholder="Nama artis..." />
          <button class="actor-apply-btn" onclick="applyActorFilter()">Terapkan</button>
        </div>
      </div>

      <!-- Category Filter -->
      <div class="sidebar-section">
        <div class="sidebar-label">Kategori</div>
        <div class="cat-filter-wrap">
          <input class="cat-input" id="catSearchInput" type="text" placeholder="Cari kategori..." oninput="filterCatList(this.value)" />
          <div class="cat-list" id="catList">
            <div style="color:var(--muted);font-size:11px;padding:4px">Memuat...</div>
          </div>
        </div>
      </div>

    </aside>

    <main class="main">
      <!-- Active filters -->
      <div class="active-filters" id="activeFilters"></div>

      <!-- Search result banner -->
      <div class="search-result-banner hidden" id="searchBanner">
        <span id="searchBannerText" style="font-size:13px;color:var(--muted)"></span>
        <button class="clear-search" onclick="clearSearch()">✕ Hapus pencarian</button>
      </div>

      <!-- Search results -->
      <div class="search-result-area" id="searchResultArea"></div>

      <!-- Browse list -->
      <div class="info-bar" id="infoBar">
        <div class="info-count">
          <span id="totalCount">0</span> JAV — Hal. <span id="curPage">1</span>/<span id="totPage">1</span>
        </div>
      </div>

      <div id="contentArea">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>

      <div class="pagination" id="paginationBar">
        <button class="page-btn" id="prevBtn" onclick="goPage(-1)">← Prev</button>
        <span class="page-num" id="pageLabel">1 / 1</span>
        <button class="page-btn" id="nextBtn" onclick="goPage(1)">Next →</button>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const PROXY = 'https://coba-railway-production.up.railway.app';

      const state = {
        page: 1, totalPages: 1, total: 0,
        type: '', actor: '', category: '',
        isLoading: false, isSearchMode: false,
      };

      // Known categories — will be populated from first load
      let allCategories = new Set();

      // ===== Image proxy =====
      function proxyImg(url) {
        if (!url) return '';
        return `${PROXY}/proxy/image?url=${encodeURIComponent(url)}`;
      }

      // ===== Type label helper =====
      function typeClass(typeName) {
        const t = (typeName || '').toLowerCase();
        if (t.includes('uncensored leak')) return 'leaked';
        if (t.includes('uncensored')) return 'uncensored';
        if (t.includes('censored')) return 'censored';
        if (t.includes('english') || t.includes('subtitle')) return 'subtitle';
        return 'other';
      }

      // ===== API =====
      async function api(endpoint, params = {}) {
        const url = new URL(`${PROXY}/${endpoint}`);
        Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) url.searchParams.append(k, v); });
        const res = await fetch(url);
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        return json;
      }

      // ===== Load List =====
      async function loadList() {
        if (state.isLoading) return;
        state.isLoading = true;
        document.getElementById('contentArea').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
        try {
          const params = { page: state.page, limit: 20 };
          if (state.type) params.type = state.type;
          if (state.actor) params.actor = state.actor;
          if (state.category) params.genre = state.category;

          const json = await api('jav/list', params);
          const d = json?.data || {};
          const items = d.data || [];
          state.page       = d.page       || 1;
          state.totalPages = d.totalPages  || 1;
          state.total      = d.total       || 0;

          // Collect categories from items
          items.forEach(item => (item.categories || []).forEach(c => allCategories.add(c)));
          renderCatList('');

          updateInfoBar();
          updatePagination();
          renderActiveFilters();

          if (!items.length) {
            document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="icon">🎌</div><p>Tidak ada JAV ditemukan</p></div>';
            return;
          }
          document.getElementById('contentArea').innerHTML = `<div class="jav-grid">${items.map(renderCard).join('')}</div>`;
        } catch (e) {
          document.getElementById('contentArea').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
        } finally {
          state.isLoading = false;
        }
      }

      function renderCard(item) {
        const thumb = item.thumb_url ? proxyImg(item.thumb_url) : 'https://picsum.photos/175/110';
        const tc = typeClass(item.type);
        const typeLabel = (item.type || '').replace('Uncensored Leaked', 'Leaked');
        const actorText = item.actors ? item.actors.split(',')[0].trim() : '';
        const dateText = item.pubDate ? (() => { try { return new Date(item.pubDate).toLocaleDateString('id-ID'); } catch(e) { return item.pubDate; } })() : '';

        return `
          <a href="jav-player.html?code=${esc(item.code)}" class="jav-card">
            <div class="card-thumb">
              <img src="${esc(thumb)}" alt="${esc(item.title)}" onerror="this.src='https://picsum.photos/175/110'" loading="lazy">
              <span class="card-code">${esc(item.code)}</span>
              ${item.type ? `<span class="card-type-badge ${tc}">${esc(typeLabel)}</span>` : ''}
              <div class="card-overlay"><span class="play-pill">▶ Tonton</span></div>
            </div>
            <div class="card-body">
              <div class="card-title">${esc(item.title)}</div>
              <div class="card-meta-row">
                <span class="card-date">${dateText}</span>
                ${actorText ? `<span class="card-actors">${esc(actorText)}</span>` : ''}
              </div>
            </div>
          </a>
        `;
      }

      // ===== Category list =====
      function renderCatList(filter) {
        const list = document.getElementById('catList');
        const cats = [...allCategories].filter(c =>
          !filter || c.toLowerCase().includes(filter.toLowerCase())
        ).sort();

        if (!cats.length) {
          list.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:4px">Belum ada data</div>';
          return;
        }
        list.innerHTML = `
          <button class="cat-btn ${!state.category ? 'active' : ''}" onclick="setCategory('', this)">Semua</button>
          ${cats.map(c => `<button class="cat-btn ${state.category === c ? 'active' : ''}" onclick="setCategory('${esc(c)}', this)">${esc(c)}</button>`).join('')}
        `;
      }

      window.filterCatList = function(val) { renderCatList(val); };

      // ===== Search =====
      async function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if (!q) { clearSearch(); return; }

        state.isSearchMode = true;
        document.getElementById('searchBanner').classList.remove('hidden');
        document.getElementById('searchBannerText').innerText = `Hasil pencarian: "${q}"`;
        document.getElementById('searchResultArea').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
        document.getElementById('contentArea').innerHTML = '';
        document.getElementById('infoBar').style.display = 'none';
        document.getElementById('paginationBar').style.display = 'none';

        try {
          const json = await api('jav/search', { q });
          const d = json?.data;
          if (!d) throw new Error('Tidak ditemukan');
          document.getElementById('searchResultArea').innerHTML = renderSearchResult(d);
        } catch (e) {
          document.getElementById('searchResultArea').innerHTML = `
            <div class="empty-state">
              <div class="icon">🔍</div>
              <p>"<strong>${esc(q)}</strong>" tidak ditemukan</p>
              <p style="font-size:12px;margin-top:6px;color:var(--muted)">Coba format kode: SSIS-392</p>
            </div>`;
        }
      }

      function renderSearchResult(d) {
        // d.variants = semua versi (censored/uncensored/dll)
        const variants = d.variants || [d];

        const cards = variants.map(v => {
          const tc = typeClass(v.type);
          const thumb = v.thumb_url || v.poster_url ? proxyImg(v.thumb_url || v.poster_url) : '';
          const metas = [
            v.year      ? `📅 ${v.year}`       : '',
            v.duration  ? `⏱ ${v.duration}`    : '',
            v.actors    ? `⭐ ${v.actors}`      : '',
            v.director  ? `🎬 ${v.director}`    : '',
            v.quality   ? `📺 ${v.quality}`     : '',
          ].filter(Boolean).map(m => `<span class="variant-badge">${esc(m)}</span>`).join('');

          const cats = (v.categories || []).slice(0, 5)
            .map(c => `<span class="variant-cat">${esc(c)}</span>`).join('');

          return `
            <div class="variant-card">
              ${thumb ? `<img class="variant-thumb" src="${esc(thumb)}" onerror="this.style.display='none'" loading="lazy">` : ''}
              <div class="variant-body">
                <span class="variant-type ${tc}">${esc(v.type || 'Unknown')}</span>
                <div class="variant-code">${esc(v.code)}</div>
                <div class="variant-title">${esc(v.title || 'Judul tidak tersedia')}</div>
                ${metas ? `<div class="variant-meta">${metas}</div>` : ''}
                ${cats ? `<div class="variant-cats">${cats}</div>` : ''}
                ${v.description ? `<div style="font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(v.description)}</div>` : ''}
                <a href="jav-player.html?code=${esc(v.code)}" class="variant-play">▶ Tonton ${esc(v.type || '')}</a>
              </div>
            </div>
          `;
        }).join('');

        return `<div class="search-variants">${cards}</div>`;
      }

      function clearSearch() {
        state.isSearchMode = false;
        document.getElementById('searchInput').value = '';
        document.getElementById('searchBanner').classList.add('hidden');
        document.getElementById('searchResultArea').innerHTML = '';
        document.getElementById('infoBar').style.display = '';
        document.getElementById('paginationBar').style.display = '';
        loadList();
      }

      // ===== Filters =====
      function setType(val, btn) {
        state.type = val; state.page = 1;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderActiveFilters();
        if (!state.isSearchMode) loadList();
      }

      window.applyActorFilter = function() {
        const val = document.getElementById('actorInput').value.trim();
        state.actor = val; state.page = 1;
        renderActiveFilters();
        if (!state.isSearchMode) loadList();
      };

      function setCategory(val, btn) {
        state.category = val; state.page = 1;
        renderCatList(document.getElementById('catSearchInput').value);
        renderActiveFilters();
        if (!state.isSearchMode) loadList();
      }

      window.setType     = setType;
      window.setCategory = setCategory;
      window.doSearch    = doSearch;
      window.clearSearch = clearSearch;
      window.goPage      = goPage;

      function renderActiveFilters() {
        const tags = [];
        if (state.type)     tags.push({ label: `Tipe: ${state.type}`,     clear: () => { state.type = ''; document.querySelector('.type-btn').click(); } });
        if (state.actor)    tags.push({ label: `Artis: ${state.actor}`,   clear: () => { state.actor = ''; document.getElementById('actorInput').value = ''; renderActiveFilters(); loadList(); } });
        if (state.category) tags.push({ label: `Kat: ${state.category}`,  clear: () => { setCategory('', null); } });
        const el = document.getElementById('activeFilters');
        el._tags = tags;
        el.innerHTML = tags.map((t, i) =>
          `<span class="filter-chip-tag">${esc(t.label)}<button onclick="clearActiveFilter(${i})">×</button></span>`
        ).join('');
      }
      window.clearActiveFilter = function(i) {
        const tags = document.getElementById('activeFilters')._tags;
        if (tags?.[i]) tags[i].clear();
      };

      // ===== Pagination =====
      function goPage(dir) {
        const next = state.page + dir;
        if (next < 1 || next > state.totalPages) return;
        state.page = next;
        loadList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function updatePagination() {
        document.getElementById('prevBtn').disabled = state.page <= 1;
        document.getElementById('nextBtn').disabled = state.page >= state.totalPages;
        document.getElementById('pageLabel').innerText = `${state.page} / ${state.totalPages}`;
      }
      function updateInfoBar() {
        document.getElementById('totalCount').innerText = state.total.toLocaleString();
        document.getElementById('curPage').innerText    = state.page;
        document.getElementById('totPage').innerText    = state.totalPages;
      }

      // ===== Enter key =====
      document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
      document.getElementById('actorInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyActorFilter(); });

      // ===== Helpers =====
      function esc(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
      }

      // ===== Init =====
      loadList();
    });
  </script>
  <script src="agegate.js"></script>
</body>
</html>
