<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History & Bookmark — XPLORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent-live: #e8365d; --accent-jav: #e84545; --accent-hentai: #6c63ff;
      --accent: #e8365d;
      --text: #f0f0f5; --muted: #6b6b80; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    /* ===== HEADER ===== */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px;
      background: linear-gradient(135deg, #e8365d, #ff6b35);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none;
    }
    .page-badge {
      font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px;
      color: var(--muted); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 6px;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px;
      transition: all 0.2s; text-decoration: none;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ===== CONTAINER ===== */
    .container { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ===== MODE TABS (History / Bookmark) ===== */
    .mode-tabs {
      display: flex; gap: 6px; margin-bottom: 24px;
    }
    .mode-tab {
      padding: 9px 22px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .mode-tab:hover { color: var(--text); }
    .mode-tab.active {
      background: rgba(232,54,93,0.12); border-color: rgba(232,54,93,0.35); color: var(--accent-live);
    }
    .mode-tab .badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface2); color: var(--muted);
      min-width: 18px; height: 18px; padding: 0 4px; border-radius: 20px; font-size: 10px;
      margin-left: 6px;
    }
    .mode-tab.active .badge { background: rgba(232,54,93,0.2); color: var(--accent-live); }

    /* ===== TYPE FILTER ===== */
    .type-filter {
      display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .type-btn {
      padding: 6px 16px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
    }
    .type-btn:hover { color: var(--text); }
    .type-btn.active-all   { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); color: var(--text); }
    .type-btn.active-live  { background: rgba(232,54,93,0.12); border-color: rgba(232,54,93,0.3); color: var(--accent-live); }
    .type-btn.active-jav   { background: rgba(232,69,69,0.12); border-color: rgba(232,69,69,0.3); color: var(--accent-jav); }
    .type-btn.active-hentai{ background: rgba(108,99,255,0.12); border-color: rgba(108,99,255,0.3); color: var(--accent-hentai); }

    /* ===== SECTION BAR ===== */
    .section-bar {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
    }
    .section-info { font-size: 12px; color: var(--muted); }
    .clear-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 4px 12px; border-radius: 6px;
      cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 12px; transition: all 0.2s;
    }
    .clear-btn:hover { color: #e84545; border-color: rgba(232,69,69,0.3); }

    /* ===== GRID ===== */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 14px;
    }

    /* ===== CARD ===== */
    .item-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden; position: relative;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .item-card.type-live:hover { border-color: rgba(232,54,93,0.35); }
    .item-card.type-jav:hover  { border-color: rgba(232,69,69,0.35); }
    .item-card.type-hentai:hover { border-color: rgba(108,99,255,0.35); }

    .card-link { text-decoration: none; color: inherit; display: block; }

    .card-thumb {
      position: relative; aspect-ratio: 16/10;
      overflow: hidden; background: var(--surface2);
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .item-card:hover .card-thumb img { transform: scale(1.05); }

    .card-type-dot {
      position: absolute; top: 7px; left: 7px;
      width: 7px; height: 7px; border-radius: 50%;
    }
    .type-live  .card-type-dot { background: var(--accent-live); }
    .type-jav   .card-type-dot { background: var(--accent-jav); }
    .type-hentai .card-type-dot { background: var(--accent-hentai); }

    .card-id {
      position: absolute; top: 7px; right: 7px;
      background: rgba(0,0,0,0.75); color: #fff;
      padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    }
    .type-jav .card-id { color: var(--accent-jav); }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.2s;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    }
    .item-card:hover .card-overlay { opacity: 1; }
    .play-pill {
      color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 500;
    }
    .type-live   .play-pill { background: var(--accent-live); }
    .type-jav    .play-pill { background: var(--accent-jav); }
    .type-hentai .play-pill { background: var(--accent-hentai); }

    .card-body { padding: 8px 10px; }
    .card-title {
      font-size: 11px; font-weight: 500; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px;
    }
    .card-meta { font-size: 10px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .card-type-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      padding: 1px 5px; border-radius: 3px;
    }
    .type-live  .card-type-label { background: rgba(232,54,93,0.15); color: var(--accent-live); }
    .type-jav   .card-type-label { background: rgba(232,69,69,0.15); color: var(--accent-jav); }
    .type-hentai .card-type-label { background: rgba(108,99,255,0.15); color: var(--accent-hentai); }

    /* Remove / bookmark btn */
    .card-actions {
      position: absolute; top: 5px; right: 5px; z-index: 5;
      display: flex; gap: 3px; opacity: 0; transition: opacity 0.2s;
    }
    .item-card:hover .card-actions { opacity: 1; }
    /* kalau ada card-id (JAV), geser card-actions ke baris bawah */
    .has-id .card-actions { top: 26px; }

    .action-btn {
      background: rgba(0,0,0,0.7); border: none;
      color: var(--muted); width: 22px; height: 22px;
      border-radius: 50%; cursor: pointer; font-size: 11px;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .action-btn:hover { color: #fff; background: rgba(0,0,0,0.9); }
    .action-btn.bm-active { color: gold; }

    /* ===== EMPTY ===== */
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; margin-bottom: 16px; }
    .browse-links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .browse-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 8px; text-decoration: none;
      font-size: 13px; font-weight: 500; transition: all 0.2s; border: 1px solid var(--border);
    }
    .browse-link.live   { background: rgba(232,54,93,0.12); color: var(--accent-live); border-color: rgba(232,54,93,0.3); }
    .browse-link.jav    { background: rgba(232,69,69,0.12); color: var(--accent-jav); border-color: rgba(232,69,69,0.3); }
    .browse-link.hentai { background: rgba(108,99,255,0.12); color: var(--accent-hentai); border-color: rgba(108,99,255,0.3); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .item-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
      .type-filter { gap: 4px; }
      .type-btn { padding: 5px 12px; font-size: 11px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="logo">XPLORE</a>
    <span class="page-badge">HISTORY</span>
  </div>
  <div class="header-right">
    <a href="index.html" class="back-btn">← Beranda</a>
  </div>
</header>

<div class="container">

  <!-- Mode: History / Bookmark -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="history" onclick="switchMode('history', this)">
      🕐 Riwayat <span class="badge" id="histBadge">0</span>
    </button>
    <button class="mode-tab" data-mode="bookmark" onclick="switchMode('bookmark', this)">
      ★ Bookmark <span class="badge" id="bmBadge">0</span>
    </button>
  </div>

  <!-- Type filter -->
  <div class="type-filter">
    <button class="type-btn active-all" data-filter="all"    onclick="setFilter('all', this)">🌐 Semua</button>
    <button class="type-btn" data-filter="live"   onclick="setFilter('live', this)">🎬 Live Action</button>
    <button class="type-btn" data-filter="jav"    onclick="setFilter('jav', this)">🎌 JAV</button>
    <button class="type-btn" data-filter="hentai" onclick="setFilter('hentai', this)">🎴 Hentai</button>
  </div>

  <!-- Section bar -->
  <div class="section-bar">
    <span class="section-info" id="sectionInfo"></span>
    <button class="clear-btn" id="clearBtn" onclick="clearCurrent()">🗑 Hapus semua</button>
  </div>

  <!-- Grid -->
  <div class="item-grid" id="grid"></div>

</div>

<script src="history-utils.js"></script>
<script>
  let currentMode   = 'history';
  let currentFilter = 'all';

  // ===== HELPERS =====
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, m =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]
    );
  }

  function relativeTime(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const m = Math.floor(diff / 60000);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (m < 1)  return 'Baru saja';
    if (m < 60) return `${m} mnt lalu`;
    if (h < 24) return `${h} jam lalu`;
    if (d < 30) return `${d} hari lalu`;
    return new Date(ts).toLocaleDateString('id-ID');
  }

  function playerUrl(item) {
    if (item.type === 'jav')    return `jav-player.html?code=${encodeURIComponent(item.id)}`;
    if (item.type === 'hentai') return `hentai-player.html?slug=${encodeURIComponent(item.id)}`;
    return `player.html?slug=${encodeURIComponent(item.id)}`;
  }

  function typeLabel(type) {
    return { live: 'Live', jav: 'JAV', hentai: 'Hentai' }[type] || type;
  }

  function thumbUrl(item) {
    if (!item.thumb) return '';
    if (item.type === 'jav') {
      return `https://images.weserv.nl/?url=${encodeURIComponent(item.thumb)}&w=165&h=103&fit=cover`;
    }
    return item.thumb;
  }

  // ===== RENDER =====
  function render() {
    const isHistory  = currentMode === 'history';
    const data       = isHistory
      ? XploreHistory.get(currentFilter === 'all' ? null : currentFilter)
      : XploreHistory.getBookmarks(currentFilter === 'all' ? null : currentFilter);
    const tsField    = isHistory ? 'watchedAt' : 'savedAt';

    updateBadges();

    const grid = document.getElementById('grid');
    const label = document.getElementById('sectionInfo');
    label.textContent = `${data.length} item`;

    if (!data.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">${isHistory ? '🕐' : '★'}</div>
          <p>Belum ada ${isHistory ? 'riwayat tontonan' : 'bookmark'}</p>
          <div class="browse-links">
            <a href="index.html" class="browse-link live">🎬 Live Action</a>
            <a href="jav.html"   class="browse-link jav">🎌 JAV</a>
            <a href="hentai.html" class="browse-link hentai">🎴 Hentai</a>
          </div>
        </div>`;
      return;
    }

    grid.innerHTML = data.map(item => {
      const thumb  = thumbUrl(item);
      const url    = playerUrl(item);
      const time   = relativeTime(item[tsField]);
      const bm     = XploreHistory.isBookmarked(item.type, item.id);
      const hasId  = item.type === 'jav';

      return `
        <div class="item-card type-${esc(item.type)} ${hasId ? 'has-id' : ''}" id="card-${esc(item.type)}-${esc(item.id)}">
          <a href="${esc(url)}" class="card-link">
            <div class="card-thumb">
              <span class="card-type-dot"></span>
              ${hasId ? `<span class="card-id">${esc(item.id)}</span>` : ''}
              ${thumb ? `<img src="${esc(thumb)}" loading="lazy" onerror="this.parentElement.style.background='var(--surface2)';this.style.display='none'" />` : ''}
              <div class="card-overlay"><span class="play-pill">▶ Tonton</span></div>
            </div>
            <div class="card-body">
              <div class="card-title">${esc(item.title || 'Tanpa judul')}</div>
              <div class="card-meta">
                <span class="card-type-label">${typeLabel(item.type)}</span>
                <span>${time}</span>
              </div>
            </div>
          </a>
          <!-- Action buttons (shown on hover) -->
          <div class="card-actions">
            <button class="action-btn ${bm ? 'bm-active' : ''}"
              title="${bm ? 'Hapus bookmark' : 'Bookmark'}"
              onclick="event.stopPropagation(); handleBookmark('${esc(item.type)}','${esc(item.id)}','${esc(item.title)}','${esc(item.thumb)}', this)">
              ${bm ? '★' : '☆'}
            </button>
            <button class="action-btn" title="Hapus"
              onclick="event.stopPropagation(); handleRemove('${esc(item.type)}','${esc(item.id)}')">
              ✕
            </button>
          </div>
        </div>`;
    }).join('');
  }

  function updateBadges() {
    document.getElementById('histBadge').textContent = XploreHistory.get().length;
    document.getElementById('bmBadge').textContent   = XploreHistory.getBookmarks().length;
  }

  // ===== ACTIONS =====
  window.handleRemove = function(type, id) {
    if (currentMode === 'history') {
      XploreHistory.remove(type, id);
    } else {
      XploreHistory.removeBookmark(type, id);
    }
    const el = document.getElementById(`card-${type}-${id}`);
    if (el) {
      el.style.transition = 'opacity 0.25s, transform 0.25s';
      el.style.opacity = '0';
      el.style.transform = 'scale(0.9)';
      setTimeout(() => { el.remove(); render(); }, 250);
    }
  };

  window.handleBookmark = function(type, id, title, thumb, btn) {
    const entry = { type, id, title, thumb };
    const isNowBm = XploreHistory.toggleBookmark(entry);
    btn.textContent = isNowBm ? '★' : '☆';
    btn.classList.toggle('bm-active', isNowBm);
    btn.title = isNowBm ? 'Hapus bookmark' : 'Bookmark';
    updateBadges();
  };

  window.clearCurrent = function() {
    const label = currentMode === 'history' ? 'riwayat' : 'bookmark';
    const filterLabel = currentFilter === 'all' ? 'semua' : currentFilter.toUpperCase();
    if (!confirm(`Hapus ${label} ${filterLabel}?`)) return;
    if (currentMode === 'history') {
      XploreHistory.clear(currentFilter === 'all' ? null : currentFilter);
    } else {
      XploreHistory.clearBookmarks(currentFilter === 'all' ? null : currentFilter);
    }
    render();
  };

  // ===== TABS & FILTER =====
  window.switchMode = function(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };

  window.setFilter = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.type-btn').forEach(b => {
      b.className = 'type-btn';
    });
    btn.classList.add(`active-${filter}`);
    render();
  };

  // ===== DEEP LINK =====
  const params = new URLSearchParams(location.search);
  if (params.get('tab') === 'bookmark') {
    const bmBtn = document.querySelector('[data-mode="bookmark"]');
    switchMode('bookmark', bmBtn);
  }
  if (params.get('type')) {
    const filterBtn = document.querySelector(`[data-filter="${params.get('type')}"]`);
    if (filterBtn) setFilter(params.get('type'), filterBtn);
  }

  // Init
  render();
</script>
<script src="agegate.js"></script>
</body>
</html>
