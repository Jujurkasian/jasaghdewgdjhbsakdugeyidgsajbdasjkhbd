<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player — XPLORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #e8365d;
      --accent2: #ff6b35;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      flex-shrink: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ===== LAYOUT ===== */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ===== PLAYER WRAPPER ===== */
    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #videoFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    /* ===== MOVIE INFO ===== */
    .info-section {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .poster-img {
      width: 120px;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .info-body { flex: 1; min-width: 0; }

    .movie-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .movie-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .meta-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .movie-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .cat-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .cat-tag:hover {
      background: rgba(232,54,93,0.15);
      border-color: rgba(232,54,93,0.3);
      color: var(--accent);
    }

    .open-embed-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }
    .open-embed-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ===== SOURCES / EPISODES ===== */
    .episodes-section { margin-top: 28px; }

    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 14px;
    }

    .episode-block { margin-bottom: 20px; }

    .ep-name {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .source-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-btn {
      padding: 8px 18px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .source-btn:hover {
      border-color: rgba(232,54,93,0.4);
      background: rgba(232,54,93,0.1);
    }
    .source-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ===== ERROR / EMPTY ===== */
    .error-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .error-state .icon { font-size: 48px; margin-bottom: 12px; }
    .error-state p { font-size: 15px; margin-bottom: 8px; }
    .error-state small { font-size: 12px; color: #444; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .info-section { flex-direction: column; }
      .poster-img { width: 100%; height: 200px; border-radius: 10px; }
      .movie-title { font-size: 16px; }
      header { padding: 0 16px; }
      .container { padding: 16px 14px 40px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">XPLORE</a>
    <button class="back-btn" id="backBtn">← Kembali</button>
  </header>

  <div class="container" id="app">
    <!-- Player -->
    <div class="player-wrap">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="spinner"></div>
        <span>Memuat film...</span>
      </div>
      <iframe
        id="videoFrame"
        allow="autoplay; fullscreen; picture-in-picture"
        scrolling="no"
      ></iframe>
    </div>

    <!-- Movie Info -->
    <div class="info-section">
      <img class="poster-img" id="poster" src="" alt="Poster" onerror="this.style.display='none'" />
      <div class="info-body">
        <h1 class="movie-title" id="title">Memuat...</h1>
        <div class="movie-meta" id="meta"></div>
        <p class="movie-desc" id="description"></p>
        <div class="categories" id="categories"></div>
        <a class="open-embed-btn" id="openEmbedBtn" href="#" target="_blank" rel="noopener">
          ↗ Buka di tab baru
        </a>
      </div>
    </div>

    <!-- Episodes & Sources -->
    <div class="episodes-section" id="episodeSection"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const PROXY = 'https://coba-railway-production.up.railway.app/api';

      // ===== Back button =====
      document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.hostname)) {
          history.back();
        } else {
          location.href = 'index.html';
        }
      });

      // ===== Get slug =====
      const slug = new URLSearchParams(location.search).get('slug');

      if (!slug) {
        showError('Slug tidak ditemukan.', 'Akses halaman ini via ?slug=nama-film');
        return;
      }

      loadMovie(slug);

      // ===== Load Movie =====
      async function loadMovie(slug) {
        try {
          const res = await fetch(`${PROXY}/movies/${slug}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();

          // Normalize response shape
          let d = json?.data ?? json;
          if (d?.data && !d?.title) d = d.data;

          if (!d?.title) throw new Error('Data film tidak valid (missing title)');

          render(d);
        } catch (err) {
          console.error('[loadMovie]', err);
          showError('Gagal memuat film.', err.message);
        }
      }

      // ===== Render =====
      function render(d) {
        document.title = `${d.title} — XPLORE`;

        document.getElementById('title').innerText = d.title;
        document.getElementById('description').innerText = d.description || '';

        const poster = document.getElementById('poster');
        poster.src = d.poster_url || d.thumbnail_url || '';

        // Meta badges
        const metaItems = [
          d.duration  ? `⏱ ${d.duration}`                     : null,
          d.quality   ? `🎬 ${d.quality}`                      : null,
          d.views     ? `👁 ${fmtNum(d.views)} views`          : null,
          d.year      ? `📅 ${d.year}`                         : null,
        ].filter(Boolean);

        document.getElementById('meta').innerHTML = metaItems
          .map(m => `<span class="meta-badge">${m}</span>`)
          .join('');

        // Categories
        const catDiv = document.getElementById('categories');
        catDiv.innerHTML = (d.categories || []).map(c =>
          `<a class="cat-tag" href="index.html?category=${c.slug || c}">${esc(c.name || c)}</a>`
        ).join('');

        // Episodes + Sources
        renderEpisodes(d.episodes || []);
      }

      function renderEpisodes(episodes) {
        const section = document.getElementById('episodeSection');

        if (!episodes.length) {
          document.getElementById('playerPlaceholder').innerHTML =
            '<span style="font-size:32px">⚠️</span><span>Tidak ada sumber video</span>';
          return;
        }

        // Collect all sources untuk auto-play first
        let firstBtn = null;

        section.innerHTML = `<div class="section-label">📀 Sumber Video</div>`;

        episodes.forEach((ep, epIdx) => {
          if (!(ep.sources || []).length) return;

          const block = document.createElement('div');
          block.className = 'episode-block';

          if (episodes.length > 1) {
            const epLabel = document.createElement('div');
            epLabel.className = 'ep-name';
            epLabel.innerText = ep.name || `Episode ${epIdx + 1}`;
            block.appendChild(epLabel);
          }

          const row = document.createElement('div');
          row.className = 'source-row';

          (ep.sources || []).forEach((src, srcIdx) => {
            if (!src.embed_url) return;

            const btn = document.createElement('button');
            btn.className = 'source-btn';
            btn.innerText = src.server_name || `Server ${srcIdx + 1}`;
            btn.dataset.embed = src.embed_url;

            btn.addEventListener('click', () => {
              playEmbed(src.embed_url);
              document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });

            row.appendChild(btn);

            if (!firstBtn) firstBtn = btn;
          });

          block.appendChild(row);
          section.appendChild(block);
        });

        // Auto-play first source
        if (firstBtn) {
          firstBtn.click();
        } else {
          document.getElementById('playerPlaceholder').innerHTML =
            '<span style="font-size:32px">⚠️</span><span>Tidak ada embed URL valid</span>';
        }
      }

      // ===== Play Embed =====
      function playEmbed(url) {
        if (!url) return;

        const frame = document.getElementById('videoFrame');
        const placeholder = document.getElementById('playerPlaceholder');

        frame.src = url;
        frame.style.display = 'block';
        placeholder.style.display = 'none';

        const openBtn = document.getElementById('openEmbedBtn');
        openBtn.href = url;
      }

      // ===== Helpers =====
      function fmtNum(n) {
        if (!n) return '0';
        if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
        if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'K';
        return n.toLocaleString();
      }

      function esc(str) {
        return String(str || '').replace(/[&<>]/g, m =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]
        );
      }

      function showError(title, detail = '') {
        document.getElementById('app').innerHTML = `
          <div class="error-state">
            <div class="icon">⚠️</div>
            <p>${esc(title)}</p>
            <small>${esc(detail)}</small>
            <br><br>
            <a href="index.html" class="back-btn" style="display:inline-flex;margin:0 auto;">← Kembali ke beranda</a>
          </div>
        `;
      }
    });
  </script>
  <script src="agegate.js"></script>
</body>
</html>
