<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player — XPLORE JAV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #e84545;
      --accent2: #ff6b35;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #e8365d, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      flex-shrink: 0;
    }

    .page-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border: 1px solid rgba(232,69,69,0.3);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .back-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ===== PLAYER ===== */
    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .player-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.55);
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .play-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 0 40px rgba(232,69,69,0.5);
    }
    .play-overlay:hover .play-circle {
      transform: scale(1.1);
      background: #c93535;
    }

    .play-label {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }

    /* JAV code badge on player */
    .player-code-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.75);
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      padding: 3px 12px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 2;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #videoFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    /* Source selector tabs */
    .source-tabs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .source-tab {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .source-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }
    .source-tab.active { background: rgba(232,69,69,0.15); border-color: rgba(232,69,69,0.4); color: var(--accent); }

    /* ===== INFO ===== */
    .info-section {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .cover-img {
      width: 140px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .info-body { flex: 1; min-width: 0; }

    .jav-code-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .movie-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .movie-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .meta-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .tag {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }
    .open-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* Thumbs gallery */
    .gallery-section {
      margin-top: 24px;
    }
    .gallery-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    .gallery-img {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .gallery-img:hover { transform: scale(1.03); border-color: rgba(232,69,69,0.4); }

    /* ===== ERROR ===== */
    .error-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .error-state .icon { font-size: 48px; margin-bottom: 12px; }
    .error-state p { font-size: 15px; margin-bottom: 8px; }

    @media (max-width: 600px) {
      .info-section { flex-direction: column; }
      .cover-img { width: 100%; height: 200px; }
      .movie-title { font-size: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">XPLORE</a>
    <span class="page-badge">JAV</span>
    <button class="back-btn" id="backBtn">← Kembali</button>
  </header>

  <div class="container" id="app">
    <!-- Player -->
    <div class="player-wrap" id="playerWrap">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="spinner"></div>
        <span>Memuat data...</span>
      </div>
      <span class="player-code-badge" id="playerCodeBadge" style="display:none"></span>
      <img id="playerPoster" class="player-poster" src="" alt="" style="display:none" />
      <div class="play-overlay" id="playOverlay" style="display:none" onclick="startPlay()">
        <div class="play-circle">▶</div>
        <span class="play-label">Klik untuk putar</span>
      </div>
      <iframe
        id="videoFrame"
        allow="autoplay; fullscreen; picture-in-picture"
        scrolling="no"
      ></iframe>
    </div>

    <!-- Source tabs -->
    <div class="source-tabs" id="sourceTabs" style="display:none"></div>

    <!-- Info -->
    <div class="info-section">
      <img class="cover-img" id="cover" src="" alt="Cover" onerror="this.style.display='none'" />
      <div class="info-body">
        <div class="jav-code-label" id="javCode"></div>
        <h1 class="movie-title" id="title">Memuat...</h1>
        <div class="movie-meta" id="meta"></div>
        <div class="tags-wrap" id="tags"></div>
        <div class="action-row">
          <a class="open-btn" id="openBtn" href="#" target="_blank" rel="noopener">↗ Buka di tab baru</a>
        </div>
      </div>
    </div>

    <!-- Gallery -->
    <div class="gallery-section" id="gallerySection" style="display:none">
      <div class="gallery-label">Preview</div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const PROXY = 'https://coba-railway-production.up.railway.app';

      // Embed sources — urutan prioritas
      const EMBED_SOURCES = [
        { label: 'Server 1', buildUrl: (code) => `https://missav.ai/en/${code}` },
        { label: 'Server 2', buildUrl: (code) => `https://javgg.net/embed/${code}` },
        { label: 'Server 3', buildUrl: (code) => `https://jav.guru/?s=${code}` },
      ];

      let currentSourceIdx = 0;
      let currentCode = '';
      let sources = [];

      // ===== Back =====
      document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.hostname)) {
          history.back();
        } else {
          location.href = 'jav.html';
        }
      });

      // ===== Code dari URL =====
      const code = new URLSearchParams(location.search).get('code');
      if (!code) {
        showError('Kode JAV tidak ditemukan.', 'Akses via ?code=SSIS-392');
        return;
      }
      currentCode = code.toUpperCase();

      loadJav(currentCode);

      // ===== Load =====
      async function loadJav(code) {
        try {
          const res  = await fetch(`${PROXY}/jav/detail/${encodeURIComponent(code)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const d    = json?.data;
          if (!d) throw new Error('Data tidak valid');
          render(d);
        } catch (err) {
          console.error('[loadJav]', err);
          // Fallback: render minimal dengan info dari URL aja
          renderFallback(code);
        }
      }

      // ===== Render =====
      function render(d) {
        document.title = `${d.code} — XPLORE JAV`;

        // Build sources
        sources = EMBED_SOURCES.map(s => ({ label: s.label, url: s.buildUrl(d.code) }));
        renderSourceTabs();

        // Poster pakai cover
        const poster = document.getElementById('playerPoster');
        if (d.coverUrl) {
          poster.src = d.coverUrl;
          poster.style.display = 'block';
        }

        // Badge di player
        const badge = document.getElementById('playerCodeBadge');
        badge.textContent = d.code;
        badge.style.display = 'block';

        // Show play overlay
        document.getElementById('playerPlaceholder').style.display = 'none';
        document.getElementById('playOverlay').style.display = 'flex';

        // Info
        document.getElementById('javCode').textContent      = d.code;
        document.getElementById('title').textContent        = d.title || 'Judul tidak tersedia';
        document.getElementById('cover').src               = d.coverUrl || '';

        // Meta
        const metas = [
          d.premiered ? `📅 ${d.premiered}` : null,
          d.duration  ? `⏱ ${d.duration}`   : null,
          d.director  ? `🎬 ${d.director}`   : null,
          d.studio    ? `🏢 ${d.studio}`     : null,
          d.actors    ? `⭐ ${d.actors}`     : null,
        ].filter(Boolean);
        document.getElementById('meta').innerHTML = metas
          .map(m => `<span class="meta-badge">${esc(m)}</span>`).join('');

        // Tags
        if (d.tags) {
          const tagList = d.tags.split(',').map(t => t.trim()).filter(Boolean);
          document.getElementById('tags').innerHTML = tagList
            .map(t => `<span class="tag">${esc(t)}</span>`).join('');
        }

        // Open btn — ke missav sebagai default
        document.getElementById('openBtn').href = sources[0]?.url || '#';

        // Gallery
        if (d.thumbs && d.thumbs.length > 0) {
          const section = document.getElementById('gallerySection');
          section.style.display = 'block';
          document.getElementById('galleryGrid').innerHTML = d.thumbs
            .map(src => `<img class="gallery-img" src="${esc(src)}" loading="lazy" onerror="this.style.display='none'" onclick="setThumb('${esc(src)}')" />`)
            .join('');
        }
      }

      // Fallback kalau detail API gagal — tetep bisa play
      function renderFallback(code) {
        document.title = `${code} — XPLORE JAV`;
        sources = EMBED_SOURCES.map(s => ({ label: s.label, url: s.buildUrl(code) }));
        renderSourceTabs();

        document.getElementById('playerPlaceholder').style.display = 'none';
        document.getElementById('playOverlay').style.display = 'flex';

        const badge = document.getElementById('playerCodeBadge');
        badge.textContent = code;
        badge.style.display = 'block';

        document.getElementById('javCode').textContent = code;
        document.getElementById('title').textContent   = 'Detail tidak tersedia — gunakan pencarian di player';
        document.getElementById('openBtn').href        = sources[0]?.url || '#';
      }

      // ===== Source Tabs =====
      function renderSourceTabs() {
        const tabsEl = document.getElementById('sourceTabs');
        tabsEl.style.display = 'flex';
        tabsEl.innerHTML = sources.map((s, i) =>
          `<button class="source-tab ${i === 0 ? 'active' : ''}" onclick="switchSource(${i})">${esc(s.label)}</button>`
        ).join('');
      }

      window.switchSource = function(idx) {
        currentSourceIdx = idx;
        document.querySelectorAll('.source-tab').forEach((b, i) => b.classList.toggle('active', i === idx));

        const frame = document.getElementById('videoFrame');
        // Kalau frame udah aktif, langsung ganti src
        if (frame.style.display !== 'none') {
          frame.src = sources[idx].url;
        }
        // Kalau belum play, update openBtn aja
        document.getElementById('openBtn').href = sources[idx].url;
      };

      // ===== Play =====
      window.startPlay = function() {
        const url = sources[currentSourceIdx]?.url;
        if (!url) return;

        const frame   = document.getElementById('videoFrame');
        const overlay = document.getElementById('playOverlay');
        const poster  = document.getElementById('playerPoster');

        frame.src = url;
        frame.style.display = 'block';
        overlay.style.display = 'none';
        poster.style.display  = 'none';
      };

      // Klik thumbnail gallery → ganti poster
      window.setThumb = function(src) {
        const poster = document.getElementById('playerPoster');
        if (poster.style.display !== 'none') {
          poster.src = src;
        }
      };

      // ===== Helpers =====
      function esc(str) {
        return String(str || '').replace(/[&<>"']/g, m =>
          ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]
        );
      }

      function showError(title, detail = '') {
        document.getElementById('app').innerHTML = `
          <div class="error-state">
            <div class="icon">⚠️</div>
            <p>${esc(title)}</p>
            <small style="color:#444;font-size:12px">${esc(detail)}</small>
            <br><br>
            <a href="jav.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;">
              ← Kembali ke daftar
            </a>
          </div>
        `;
      }
    });
  </script>
  <script src="agegate.js"></script>
</body>
</html>
