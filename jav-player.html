<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player — XPLORE JAV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --surface2: #1c1c28;
        --border: rgba(255, 255, 255, 0.07);
        --accent: #e84545;
        --accent2: #ff6b35;
        --text: #f0f0f5;
        --muted: #6b6b80;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface2);
        border-radius: 3px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(10, 10, 15, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        height: 60px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 16px;
      }
      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 26px;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #e8365d, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
        flex-shrink: 0;
      }
      .page-badge {
        font-family: "Bebas Neue", sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        border: 1px solid rgba(232, 69, 69, 0.3);
        padding: 3px 10px;
        border-radius: 6px;
      }
      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        transition: all 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .bookmark-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        transition: all 0.2s;
      }
      .bookmark-btn.active {
        background: rgba(232, 69, 69, 0.15);
        border-color: rgba(232, 69, 69, 0.4);
        color: var(--accent);
      }
      .bookmark-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }

      /* ===== PLAYER ===== */
      .player-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .player-poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .play-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .play-circle {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        transition:
          transform 0.2s,
          background 0.2s;
        box-shadow: 0 0 40px rgba(232, 69, 69, 0.5);
      }
      .play-overlay:hover .play-circle {
        transform: scale(1.1);
        background: #c93535;
      }
      .play-label {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 500;
      }
      .player-code-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(0, 0, 0, 0.75);
        color: var(--accent);
        font-family: "Bebas Neue", sans-serif;
        font-size: 15px;
        letter-spacing: 2px;
        padding: 3px 12px;
        border-radius: 6px;
        pointer-events: none;
        z-index: 2;
      }
      .player-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--surface2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .player-fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.92);
        z-index: 10;
      }
      .player-fallback.visible {
        display: flex;
      }
      .fallback-icon {
        font-size: 40px;
      }
      .fallback-text {
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }
      .fallback-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .fallback-btn {
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        transition: all 0.2s;
        border: 1px solid var(--border);
      }
      .fallback-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .fallback-btn.primary:hover {
        background: #c93535;
      }
      .fallback-btn.secondary {
        background: var(--surface2);
        color: var(--muted);
      }
      .fallback-btn.secondary:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.2);
      }

      #videoFrame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: none;
      }

      .source-tabs {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .source-tab {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: "DM Sans", sans-serif;
      }
      .source-tab:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .source-tab.active {
        background: rgba(232, 69, 69, 0.15);
        border-color: rgba(232, 69, 69, 0.4);
        color: var(--accent);
      }

      /* ===== INFO ===== */
      .info-section {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .cover-img {
        width: 140px;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--surface);
      }
      .info-body {
        flex: 1;
        min-width: 0;
      }
      .jav-code-label {
        font-family: "Bebas Neue", sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .movie-title {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 10px;
      }
      .movie-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .meta-badge {
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 12px;
        color: var(--muted);
      }
      .tags-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
      }
      .tag {
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 4px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
      }
      .tag:hover {
        color: var(--accent);
        border-color: rgba(232, 69, 69, 0.3);
      }
      .action-row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .open-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        transition: all 0.2s;
      }
      .open-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* ===== GALLERY ===== */
      .section-header {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .gallery-section {
        margin-top: 28px;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 8px;
      }
      .gallery-img {
        width: 100%;
        aspect-ratio: 16/10;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid var(--border);
        cursor: pointer;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .gallery-img:hover {
        transform: scale(1.03);
        border-color: rgba(232, 69, 69, 0.4);
      }

      /* ===== RELATED ===== */
      .related-section {
        margin-top: 32px;
      }
      .related-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
      }
      .related-card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        overflow: hidden;
        text-decoration: none;
        display: block;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .related-card:hover {
        transform: translateY(-3px);
        border-color: rgba(232, 69, 69, 0.35);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      }
      .related-thumb {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        background: var(--surface2);
      }
      .related-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .related-card:hover .related-thumb img {
        transform: scale(1.06);
      }
      .related-code {
        position: absolute;
        top: 5px;
        left: 5px;
        background: rgba(0, 0, 0, 0.8);
        color: var(--accent);
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .related-body {
        padding: 8px 10px;
      }
      .related-title {
        font-size: 10px;
        font-weight: 500;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 3px;
      }
      .related-meta {
        font-size: 10px;
        color: var(--muted);
      }

      /* ===== ERROR ===== */
      .error-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
      }
      .error-state .icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      .error-state p {
        font-size: 15px;
        margin-bottom: 8px;
      }

      @media (max-width: 600px) {
        .info-section {
          flex-direction: column;
        }
        .cover-img {
          width: 100%;
          height: 200px;
        }
        .movie-title {
          font-size: 15px;
        }
        .related-grid {
          grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">XPLORE</a>
      <span class="page-badge">JAV</span>
      <div class="header-right">
        <button
          class="bookmark-btn"
          id="bookmarkBtn"
          onclick="toggleBookmark()"
        >
          ☆ Simpan
        </button>
        <a href="history.html" class="back-btn">🕐 History</a>
        <button class="back-btn" id="backBtn">← Kembali</button>
      </div>
    </header>

    <div class="container" id="app">
      <div class="player-wrap" id="playerWrap">
        <div class="player-placeholder" id="playerPlaceholder">
          <div class="spinner"></div>
          <span>Memuat data...</span>
        </div>
        <span
          class="player-code-badge"
          id="playerCodeBadge"
          style="display: none"
        ></span>
        <img
          id="playerPoster"
          class="player-poster"
          src=""
          alt=""
          style="display: none"
        />
        <div
          class="play-overlay"
          id="playOverlay"
          style="display: none"
          onclick="startPlay()"
        >
          <div class="play-circle">▶</div>
          <span class="play-label">Klik untuk putar</span>
        </div>
        <iframe
          id="videoFrame"
          allow="autoplay; fullscreen; picture-in-picture"
          scrolling="no"
        ></iframe>
        <div class="player-fallback" id="playerFallback">
          <div class="fallback-icon">⚠️</div>
          <div class="fallback-text">
            Server ini tidak bisa diload.<br />Coba server lain atau buka di tab
            baru.
          </div>
          <div class="fallback-actions">
            <button class="fallback-btn primary" onclick="tryNextSource()">
              ▶ Coba Server Berikutnya
            </button>
            <button class="fallback-btn secondary" onclick="hideFallback()">
              ✕ Tutup
            </button>
          </div>
        </div>
      </div>

      <div class="source-tabs" id="sourceTabs" style="display: none"></div>

      <div class="info-section">
        <img
          class="cover-img"
          id="cover"
          src=""
          alt="Cover"
          onerror="this.style.display = 'none'"
        />
        <div class="info-body">
          <div class="jav-code-label" id="javCode"></div>
          <h1 class="movie-title" id="title">Memuat...</h1>
          <div class="movie-meta" id="meta"></div>
          <div class="tags-wrap" id="tags"></div>
          <div class="action-row">
            <a
              class="open-btn"
              id="openBtn"
              href="#"
              target="_blank"
              rel="noopener"
              >↗ Buka di tab baru</a
            >
            <a class="open-btn" href="history.html">🕐 History & Bookmark</a>
          </div>
        </div>
      </div>

      <div class="gallery-section" id="gallerySection" style="display: none">
        <div class="section-header">Preview</div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>

      <div class="related-section" id="relatedSection" style="display: none">
        <div class="section-header">Konten Serupa</div>
        <div class="related-grid" id="relatedGrid"></div>
      </div>
    </div>

    <script src="history-utils.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const PROXY = "https://coba-railway-production.up.railway.app";

        const EMBED_SOURCES = [
          {
            label: "Server 1",
            buildUrl: (code) =>
              `https://upload18.org/play/index/${code.toLowerCase()}`,
          },
          {
            label: "Server 2",
            buildUrl: (code) => `https://javgg.net/embed/${code}`,
          },
          {
            label: "Server 3",
            buildUrl: (code) => `https://jav.guru/?s=${code}`,
          },
        ];

        let currentSourceIdx = 0;
        let currentCode = "";
        let sources = [];
        let currentData = null;
        let fallbackTimer = null;

        // ===== BACK =====
        document.getElementById("backBtn").addEventListener("click", () => {
          if (
            document.referrer &&
            document.referrer.includes(location.hostname)
          ) {
            history.back();
          } else {
            location.href = "jav.html";
          }
        });

        // ===== CODE DARI URL =====
        const code = new URLSearchParams(location.search).get("code");
        if (!code) {
          showError("Kode JAV tidak ditemukan.", "Akses via ?code=SSIS-392");
          return;
        }
        currentCode = code.toUpperCase();

        loadJav(currentCode);

        // ===== LOAD =====
        async function loadJav(code) {
          try {
            const res = await fetch(
              `${PROXY}/jav/detail/${encodeURIComponent(code)}`,
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            const d = json?.data;
            if (!d) throw new Error("Data tidak valid");
            currentData = d;
            render(d);
          } catch (err) {
            console.error("[loadJav]", err);
            renderFallback(code);
          }
        }

        // ===== RENDER =====
        function render(d) {
          document.title = `${d.code} — XPLORE JAV`;

          sources = EMBED_SOURCES.map((s) => ({
            label: s.label,
            url: s.buildUrl(d.code),
          }));
          renderSourceTabs();

          const poster = document.getElementById("playerPoster");
          const posterUrl = d.poster_url || d.thumb_url || d.coverUrl || "";
          if (posterUrl) {
            poster.src = posterUrl;
            poster.style.display = "block";
          }

          const badge = document.getElementById("playerCodeBadge");
          badge.textContent = d.code;
          badge.style.display = "block";

          document.getElementById("playerPlaceholder").style.display = "none";
          document.getElementById("playOverlay").style.display = "flex";

          document.getElementById("javCode").textContent = d.code;
          document.getElementById("title").textContent =
            d.title || "Judul tidak tersedia";
          document.getElementById("cover").src =
            d.poster_url || d.thumb_url || d.coverUrl || "";

          const metas = [
            d.year ? `📅 ${d.year}` : d.premiered ? `📅 ${d.premiered}` : null,
            d.duration ? `⏱ ${d.duration}` : null,
            d.director ? `🎬 ${d.director}` : null,
            d.studio ? `🏢 ${d.studio}` : null,
            d.actors ? `⭐ ${d.actors}` : null,
          ].filter(Boolean);
          document.getElementById("meta").innerHTML = metas
            .map((m) => `<span class="meta-badge">${esc(m)}</span>`)
            .join("");

          const catList =
            d.categories ||
            (d.tags ? d.tags.split(",").map((t) => t.trim()) : []);
          if (catList.length) {
            document.getElementById("tags").innerHTML = catList
              .map(
                (t) =>
                  `<span class="tag" onclick="filterByCat('${esc(t)}')">${esc(t)}</span>`,
              )
              .join("");
          }

          document.getElementById("openBtn").href = sources[0]?.url || "#";

          const thumbs = d.thumbs || [];
          if (thumbs.length) {
            document.getElementById("gallerySection").style.display = "block";
            document.getElementById("galleryGrid").innerHTML = thumbs
              .map(
                (src) =>
                  `<img class="gallery-img" src="${esc(src)}" loading="lazy" onerror="this.style.display='none'" onclick="setThumb('${esc(src)}')" />`,
              )
              .join("");
          }

          // ===== Save unified history =====
          XploreHistory.save({
            type: "jav",
            id: d.code,
            title: d.title || "",
            thumb: d.thumb_url || d.poster_url || "",
            actors: d.actors || "",
          });
          updateBookmarkBtn();

          const firstCat = catList[0];
          if (firstCat) loadRelated(firstCat, d.code);
        }

        function renderFallback(code) {
          document.title = `${code} — XPLORE JAV`;
          sources = EMBED_SOURCES.map((s) => ({
            label: s.label,
            url: s.buildUrl(code),
          }));
          renderSourceTabs();
          document.getElementById("playerPlaceholder").style.display = "none";
          document.getElementById("playOverlay").style.display = "flex";
          const badge = document.getElementById("playerCodeBadge");
          badge.textContent = code;
          badge.style.display = "block";
          document.getElementById("javCode").textContent = code;
          document.getElementById("title").textContent =
            "Detail tidak tersedia — gunakan pencarian di player";
          document.getElementById("openBtn").href = sources[0]?.url || "#";

          // Save history meski detail gagal
          XploreHistory.save({
            type: "jav",
            id: code,
            title: "",
            thumb: "",
            actors: "",
          });
          updateBookmarkBtn();
        }

        // ===== BOOKMARK =====
        window.toggleBookmark = function () {
          if (!currentCode) return;
          XploreHistory.toggleBookmark({
            type: "jav",
            id: currentCode,
            title: document.getElementById("title").textContent,
            thumb: currentData?.thumb_url || currentData?.poster_url || "",
          });
          updateBookmarkBtn();
        };

        function updateBookmarkBtn() {
          const isBm = XploreHistory.isBookmarked("jav", currentCode);
          const btn = document.getElementById("bookmarkBtn");
          btn.textContent = isBm ? "★ Tersimpan" : "☆ Simpan";
          btn.classList.toggle("active", isBm);
        }

        // ===== RELATED =====
        async function loadRelated(genre, excludeCode) {
          try {
            const res = await fetch(
              `${PROXY}/jav/list?genre=${encodeURIComponent(genre)}&limit=8`,
            );
            const json = await res.json();
            const items = (json?.data?.data || [])
              .filter((i) => i.code !== excludeCode)
              .slice(0, 8);
            if (!items.length) return;

            document.getElementById("relatedSection").style.display = "block";
            document.getElementById("relatedGrid").innerHTML = items
              .map((item) => {
                const thumb = item.thumb_url
                  ? `https://images.weserv.nl/?url=${encodeURIComponent(item.thumb_url)}&w=160&h=100&fit=cover`
                  : "";
                const actorText = item.actors
                  ? item.actors.split(",")[0].trim()
                  : "";
                return `
              <a href="jav-player.html?code=${esc(item.code)}" class="related-card">
                <div class="related-thumb">
                  ${thumb ? `<img src="${esc(thumb)}" loading="lazy" onerror="this.parentElement.style.background='var(--surface2)';this.style.display='none'" />` : ""}
                  <span class="related-code">${esc(item.code)}</span>
                </div>
                <div class="related-body">
                  <div class="related-title">${esc(item.title)}</div>
                  ${actorText ? `<div class="related-meta">${esc(actorText)}</div>` : ""}
                </div>
              </a>`;
              })
              .join("");
          } catch (e) {
            console.warn("[loadRelated]", e);
          }
        }

        // ===== SOURCE TABS =====
        function renderSourceTabs() {
          const tabsEl = document.getElementById("sourceTabs");
          tabsEl.style.display = "flex";
          tabsEl.innerHTML = sources
            .map(
              (s, i) =>
                `<button class="source-tab ${i === 0 ? "active" : ""}" onclick="switchSource(${i})">${esc(s.label)}</button>`,
            )
            .join("");
        }

        window.switchSource = function (idx) {
          currentSourceIdx = idx;
          document
            .querySelectorAll(".source-tab")
            .forEach((b, i) => b.classList.toggle("active", i === idx));
          hideFallback();
          const frame = document.getElementById("videoFrame");
          if (frame.style.display !== "none") loadFrame(sources[idx].url);
          document.getElementById("openBtn").href = sources[idx]?.url || "#";
        };

        // ===== PLAY =====
        window.startPlay = function () {
          const url = sources[currentSourceIdx]?.url;
          if (!url) return;
          document.getElementById("playOverlay").style.display = "none";
          document.getElementById("playerPoster").style.display = "none";
          loadFrame(url);
        };

        function loadFrame(url) {
          const frame = document.getElementById("videoFrame");
          hideFallback();
          frame.style.display = "block";
          frame.src = url;

          clearTimeout(fallbackTimer);
          fallbackTimer = setTimeout(() => {
            if (frame.style.display !== "none") showFallback();
          }, 12000);

          frame.onload = () => clearTimeout(fallbackTimer);
          frame.onerror = () => showFallback();
        }

        function showFallback() {
          clearTimeout(fallbackTimer);
          document.getElementById("playerFallback").classList.add("visible");
        }
        function hideFallback() {
          clearTimeout(fallbackTimer);
          document.getElementById("playerFallback").classList.remove("visible");
        }

        window.hideFallback = hideFallback;
        window.tryNextSource = function () {
          const next = currentSourceIdx + 1;
          if (next >= sources.length) {
            document.querySelector(".fallback-text").textContent =
              "Semua server gagal. Coba buka di tab baru.";
            document.querySelector(".fallback-btn.primary").style.display =
              "none";
            return;
          }
          switchSource(next);
          const frame = document.getElementById("videoFrame");
          if (frame.style.display !== "none") loadFrame(sources[next].url);
          else startPlay();
        };

        window.setThumb = function (src) {
          const poster = document.getElementById("playerPoster");
          if (poster.style.display !== "none") poster.src = src;
        };

        window.filterByCat = function (cat) {
          location.href = `jav.html?category=${encodeURIComponent(cat)}`;
        };

        // ===== HELPERS =====
        function esc(str) {
          return String(str || "").replace(
            /[&<>"']/g,
            (m) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[m],
          );
        }

        function showError(title, detail = "") {
          document.getElementById("app").innerHTML = `
          <div class="error-state">
            <div class="icon">⚠️</div>
            <p>${esc(title)}</p>
            <small style="color:#444;font-size:12px">${esc(detail)}</small>
            <br><br>
            <a href="jav.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;">
              ← Kembali ke daftar
            </a>
          </div>`;
        }
      });
    </script>
    <script src="agegate.js"></script>
  </body>
</html>
