<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player — XPLORE Hentai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #48cfad;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 3px; }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #e8365d, #ff6b35);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      flex-shrink: 0;
    }

    .page-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border: 1px solid rgba(108,99,255,0.3);
      padding: 3px 10px;
      border-radius: 6px;
    }

    .back-btn {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ===== PLAYER ===== */
    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Thumbnail overlay sebelum play */
    .player-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      cursor: pointer;
      transition: opacity 0.3s;
    }

    .play-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 0 40px rgba(108,99,255,0.5);
    }
    .play-overlay:hover .play-circle {
      transform: scale(1.1);
      background: #5a52e0;
    }

    .play-label {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #videoFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    /* ===== INFO ===== */
    .info-section {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .cover-img {
      width: 120px;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .info-body { flex: 1; min-width: 0; }

    .movie-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .movie-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .meta-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    .movie-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .genre-tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .genre-tag:hover {
      background: rgba(108,99,255,0.15);
      border-color: rgba(108,99,255,0.3);
      color: var(--accent);
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 7px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }
    .open-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* ===== ERROR ===== */
    .error-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .error-state .icon { font-size: 48px; margin-bottom: 12px; }
    .error-state p { font-size: 15px; margin-bottom: 8px; }

    @media (max-width: 600px) {
      .info-section { flex-direction: column; }
      .cover-img { width: 100%; height: 200px; }
      .movie-title { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">XPLORE</a>
    <span class="page-badge">HENTAI</span>
    <button class="back-btn" id="backBtn">← Kembali</button>
  </header>

  <div class="container" id="app">
    <!-- Player: default state = loading -->
    <div class="player-wrap" id="playerWrap">
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="spinner"></div>
        <span>Memuat data...</span>
      </div>
      <!-- Poster + play overlay (muncul setelah data loaded) -->
      <img id="playerPoster" class="player-poster" src="" alt="" style="display:none" />
      <div class="play-overlay" id="playOverlay" style="display:none" onclick="startPlay()">
        <div class="play-circle">▶</div>
        <span class="play-label">Klik untuk putar</span>
      </div>
      <!-- Iframe: hanya di-set src setelah user klik play -->
      <iframe
        id="videoFrame"
        allow="autoplay; fullscreen; picture-in-picture"
        scrolling="no"
      ></iframe>
    </div>

    <!-- Info -->
    <div class="info-section">
      <img class="cover-img" id="cover" src="" alt="Cover" onerror="this.style.display='none'" />
      <div class="info-body">
        <h1 class="movie-title" id="title">Memuat...</h1>
        <div class="movie-meta" id="meta"></div>
        <p class="movie-desc" id="description"></p>
        <div class="genres" id="genres"></div>
        <a class="open-btn" id="openBtn" href="#" target="_blank" rel="noopener">
          ↗ Buka di tab baru
        </a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const PROXY = 'https://coba-railway-production.up.railway.app';
      let embedUrl = '';

      // ===== Back =====
      document.getElementById('backBtn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.hostname)) {
          history.back();
        } else {
          location.href = 'hentai.html';
        }
      });

      // ===== Slug =====
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) {
        showError('Slug tidak ditemukan.', 'Akses via ?slug=nama-hentai');
        return;
      }

      loadHentai(slug);

      // ===== Load =====
      async function loadHentai(slug) {
        try {
          const res  = await fetch(`${PROXY}/hentai/${slug}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          const d    = json?.data;
          if (!d?.title) throw new Error('Data tidak valid');
          render(d);
        } catch (err) {
          console.error('[loadHentai]', err);
          showError('Gagal memuat hentai.', err.message);
        }
      }

      // ===== Render =====
      function render(d) {
        document.title = `${d.title} — XPLORE`;
        embedUrl = d.embedUrl || `https://hentaiocean.com/embed/${slug}`;

        // Poster (thumbnail untuk preview)
        const poster = document.getElementById('playerPoster');
        poster.src = d.thumbnail || d.cover || '';
        poster.style.display = 'block';

        // Show play overlay, hide spinner
        document.getElementById('playerPlaceholder').style.display = 'none';
        document.getElementById('playOverlay').style.display = 'flex';

        // Info
        document.getElementById('title').innerText       = d.title;
        document.getElementById('description').innerText = d.description || '';
        document.getElementById('cover').src             = d.cover || d.thumbnail || '';

        // Meta
        const metas = [
          d.releaseDate ? `📅 ${d.releaseDate}` : null,
          d.uploadDate  ? `⬆ Upload: ${d.uploadDate}` : null,
        ].filter(Boolean);
        document.getElementById('meta').innerHTML = metas
          .map(m => `<span class="meta-badge">${m}</span>`).join('');

        // Genres
        document.getElementById('genres').innerHTML = (d.genres || [])
          .map(g => `<a class="genre-tag" href="hentai.html?genre=${encodeURIComponent(g)}">${esc(g)}</a>`)
          .join('');

        // Open button
        document.getElementById('openBtn').href = embedUrl;
      }

      // ===== Play: set iframe src hanya saat user klik =====
      window.startPlay = function() {
        if (!embedUrl) return;

        const frame   = document.getElementById('videoFrame');
        const overlay = document.getElementById('playOverlay');
        const poster  = document.getElementById('playerPoster');

        // Lazy load: set src sekarang baru iframe mulai load
        frame.src = embedUrl;
        frame.style.display = 'block';
        overlay.style.display = 'none';
        poster.style.display  = 'none';
      };

      // ===== Helpers =====
      function esc(str) {
        return String(str || '').replace(/[&<>"']/g, m =>
          ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]
        );
      }

      function showError(title, detail = '') {
        document.getElementById('app').innerHTML = `
          <div class="error-state">
            <div class="icon">⚠️</div>
            <p>${esc(title)}</p>
            <small style="color:#444;font-size:12px">${esc(detail)}</small>
            <br><br>
            <a href="hentai.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;">
              ← Kembali ke daftar
            </a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
