<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPLORE — Hentai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --surface2: #1c1c28;
        --border: rgba(255, 255, 255, 0.07);
        --accent: #6c63ff;
        --accent2: #48cfad;
        --text: #f0f0f5;
        --muted: #6b6b80;
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface2);
        border-radius: 3px;
      }

      /* ===== HEADER ===== */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(10, 10, 15, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo {
        font-family: "Bebas Neue", sans-serif;
        font-size: 26px;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #e8365d, #ff6b35);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
      }

      .page-badge {
        font-family: "Bebas Neue", sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        border: 1px solid rgba(108, 99, 255, 0.3);
        padding: 3px 10px;
        border-radius: 6px;
      }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        transition: all 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.15);
      }

      /* ===== LAYOUT ===== */
      .layout {
        display: flex;
        min-height: calc(100vh - 60px);
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 20px 0;
        position: sticky;
        top: 60px;
        height: calc(100vh - 60px);
        overflow-y: auto;
      }

      .sidebar-section {
        padding: 0 16px 20px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .sidebar-section:last-child {
        border-bottom: none;
      }

      .sidebar-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .filter-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: none;
        border: none;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        width: 100%;
        transition: all 0.15s;
      }
      .filter-chip:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .filter-chip.active {
        background: rgba(108, 99, 255, 0.15);
        color: var(--accent);
      }

      .genre-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 300px;
        overflow-y: auto;
      }

      .genre-btn {
        padding: 6px 10px;
        border-radius: 6px;
        background: none;
        border: none;
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
      }
      .genre-btn:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .genre-btn.active {
        color: var(--accent);
        background: rgba(108, 99, 255, 0.12);
      }

      /* ===== MAIN ===== */
      .main {
        flex: 1;
        min-width: 0;
        padding: 24px;
      }

      .info-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .info-count {
        font-size: 13px;
        color: var(--muted);
      }
      .info-count span {
        color: var(--text);
        font-weight: 600;
      }

      .active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }

      .filter-tag {
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(108, 99, 255, 0.15);
        border: 1px solid rgba(108, 99, 255, 0.3);
        color: var(--accent);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
      }
      .filter-tag button {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }

      /* ===== GRID ===== */
      .hentai-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
      }

      .hentai-card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
        text-decoration: none;
        display: block;
      }
      .hentai-card:hover {
        transform: translateY(-4px);
        border-color: rgba(108, 99, 255, 0.35);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      }

      .card-thumb {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        background: var(--surface2);
      }
      .card-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .hentai-card:hover .card-thumb img {
        transform: scale(1.06);
      }

      .card-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.85) 0%,
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.2s;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 10px;
      }
      .hentai-card:hover .card-overlay {
        opacity: 1;
      }

      .play-btn {
        background: var(--accent);
        color: #fff;
        padding: 7px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
      }

      .card-body {
        padding: 10px 12px;
      }

      .card-title {
        font-size: 13px;
        font-weight: 500;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 6px;
        line-height: 1.4;
      }

      .card-genres {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .genre-tag {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--surface2);
        color: var(--muted);
        border: none;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        transition: all 0.15s;
      }
      .genre-tag:hover {
        background: rgba(108, 99, 255, 0.15);
        color: var(--accent);
      }

      /* ===== LOADING / EMPTY ===== */
      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--surface2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }
      .empty-state .icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      .empty-state p {
        font-size: 15px;
      }

      /* ===== PAGINATION ===== */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 32px;
      }
      .page-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        transition: all 0.2s;
      }
      .page-btn:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
      }
      .page-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .page-num {
        font-size: 13px;
        color: var(--muted);
        padding: 0 8px;
      }

      /* ===== MOBILE ===== */
      .sidebar-toggle {
        display: none;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        align-items: center;
        gap: 6px;
      }

      @media (max-width: 768px) {
        .sidebar {
          display: none;
        }
        .sidebar.open {
          display: block;
          position: fixed;
          top: 60px;
          left: 0;
          z-index: 99;
          height: calc(100vh - 60px);
        }
        .sidebar-toggle {
          display: flex;
        }
        .hentai-grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <a href="index.html" class="logo">XPLORE</a>
        <span class="page-badge">HENTAI</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button
          class="sidebar-toggle"
          onclick="document.getElementById('sidebar').classList.toggle('open')"
        >
          ☰ Filter
        </button>
        <a href="index.html" class="back-btn">← Live Action</a>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">Urutkan</div>
          <div class="filter-group" id="sortGroup">
            <button
              class="filter-chip active"
              onclick="setSort('newest', this)"
            >
              <span>🕐</span> Terbaru
            </button>
            <button class="filter-chip" onclick="setSort('oldest', this)">
              <span>📅</span> Terlama
            </button>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">Genre</div>
          <div class="genre-list" id="genreList">
            <div style="color: var(--muted); font-size: 12px; padding: 4px">
              Memuat...
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="active-filters" id="activeFilters"></div>

        <div class="info-bar">
          <div class="info-count">
            Menampilkan <span id="totalCount">0</span> hentai — Hal.
            <span id="curPage">1</span>/<span id="totPage">1</span>
          </div>
        </div>

        <div id="contentArea">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>

        <div class="pagination">
          <button class="page-btn" id="prevBtn" onclick="goPage(-1)">
            ← Prev
          </button>
          <span class="page-num" id="pageLabel">1 / 1</span>
          <button class="page-btn" id="nextBtn" onclick="goPage(1)">
            Next →
          </button>
        </div>
      </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const PROXY = "https://coba-railway-production.up.railway.app";

        const state = {
          page: 1,
          totalPages: 1,
          total: 0,
          sort: "newest",
          genre: "",
          isLoading: false,
        };

        // ===== API =====
        async function api(endpoint, params = {}) {
          const url = new URL(`${PROXY}/${endpoint}`);
          Object.entries(params).forEach(([k, v]) => {
            if (v !== "" && v != null) url.searchParams.append(k, v);
          });
          const res = await fetch(url);
          const json = await res.json();
          if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
          return json;
        }

        // ===== Load Genres =====
        async function loadGenres() {
          try {
            const json = await api("hentai/genres");
            const genres = json?.data?.genres || [];
            const list = document.getElementById("genreList");
            list.innerHTML = `
            <button class="genre-btn active" onclick="setGenre('', this)">Semua</button>
            ${genres.map((g) => `<button class="genre-btn" onclick="setGenre('${esc(g)}', this)">${esc(g)}</button>`).join("")}
          `;
          } catch (e) {
            document.getElementById("genreList").innerHTML =
              '<div style="color:var(--muted);font-size:12px;padding:4px">Gagal load genre</div>';
          }
        }

        // ===== Load Hentai List =====
        async function loadList() {
          if (state.isLoading) return;
          state.isLoading = true;
          document.getElementById("contentArea").innerHTML =
            '<div class="loading-spinner"><div class="spinner"></div></div>';

          try {
            const params = { page: state.page, limit: 20 };
            if (state.genre) params.genre = state.genre;

            const json = await api("hentai/list", params);
            const d = json?.data || {};
            let items = d.data || [];

            // Client-side sort
            if (state.sort === "oldest") {
              items = [...items].sort(
                (a, b) => new Date(a.pubDate) - new Date(b.pubDate),
              );
            }

            state.page = d.page || 1;
            state.totalPages = d.totalPages || 1;
            state.total = d.total || 0;

            updateInfoBar();
            updatePagination();
            renderActiveFilters();

            if (!items.length) {
              document.getElementById("contentArea").innerHTML =
                '<div class="empty-state"><div class="icon">🎌</div><p>Tidak ada hentai ditemukan</p></div>';
              return;
            }

            document.getElementById("contentArea").innerHTML =
              `<div class="hentai-grid">${items.map(renderCard).join("")}</div>`;
          } catch (e) {
            document.getElementById("contentArea").innerHTML =
              `<div class="empty-state"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
          } finally {
            state.isLoading = false;
          }
        }

        function renderCard(item) {
          const genres = (item.genres || [])
            .slice(0, 2)
            .map(
              (g) =>
                `<button class="genre-tag" onclick="setGenre('${esc(g)}', null)">${esc(g)}</button>`,
            )
            .join("");

          const rawThumb = item.cover || item.thumb_url || "";
          const thumb = rawThumb
            ? `https://coba-railway-production.up.railway.app/jav/thumb?url=${encodeURIComponent(rawThumb)}`
            : "";

          return `
          <a href="hentai-player.html?slug=${esc(item.slug)}" class="hentai-card">
            <div class="card-thumb">
              <img src="${esc(thumb)}" alt="${esc(item.title)}"
                   onerror="this.src='https://picsum.photos/180/112'" loading="lazy">
              <div class="card-overlay">
                <span class="play-btn">▶ Tonton</span>
              </div>
            </div>
            <div class="card-body">
              <div class="card-title">${esc(item.title)}</div>
              <div class="card-genres">${genres}</div>
            </div>
          </a>
        `;
        }

        // ===== Filters =====
        function setSort(val, btn) {
          state.sort = val;
          state.page = 1;
          document
            .querySelectorAll("#sortGroup .filter-chip")
            .forEach((b) => b.classList.remove("active"));
          if (btn) btn.classList.add("active");
          loadList();
        }

        function setGenre(val, btn) {
          state.genre = val;
          state.page = 1;
          document
            .querySelectorAll(".genre-btn")
            .forEach((b) => b.classList.remove("active"));
          if (btn) btn.classList.add("active");
          else {
            // find matching btn
            document.querySelectorAll(".genre-btn").forEach((b) => {
              if (b.textContent.trim().toLowerCase() === val.toLowerCase())
                b.classList.add("active");
            });
          }
          loadList();
        }

        // expose globally untuk onclick inline
        window.setGenre = setGenre;
        window.setSort = setSort;
        window.goPage = goPage;

        function renderActiveFilters() {
          const tags = [];
          if (state.genre)
            tags.push({
              label: `Genre: ${state.genre}`,
              clear: () => setGenre("", document.querySelector(".genre-btn")),
            });
          document.getElementById("activeFilters").innerHTML = tags
            .map(
              (t, i) =>
                `<span class="filter-tag">${esc(t.label)} <button onclick="clearFilter(${i})">×</button></span>`,
            )
            .join("");
          document.getElementById("activeFilters")._tags = tags;
        }

        window.clearFilter = (i) => {
          const tags = document.getElementById("activeFilters")._tags;
          if (tags?.[i]) tags[i].clear();
        };

        // ===== Pagination =====
        function goPage(dir) {
          const next = state.page + dir;
          if (next < 1 || next > state.totalPages) return;
          state.page = next;
          loadList();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function updatePagination() {
          document.getElementById("prevBtn").disabled = state.page <= 1;
          document.getElementById("nextBtn").disabled =
            state.page >= state.totalPages;
          document.getElementById("pageLabel").innerText =
            `${state.page} / ${state.totalPages}`;
        }

        function updateInfoBar() {
          document.getElementById("totalCount").innerText =
            state.total.toLocaleString();
          document.getElementById("curPage").innerText = state.page;
          document.getElementById("totPage").innerText = state.totalPages;
        }

        // ===== Helpers =====
        function esc(str) {
          return String(str || "").replace(
            /[&<>"']/g,
            (m) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[m],
          );
        }

        // ===== Init =====
        loadGenres();
        loadList();
      });
    </script>
    <script src="history-utils.js"></script>
    <script src="agegate.js"></script>
  </body>
</html>
